name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@llazyemail'

      - name: Configure GitHub Packages auth
        run: |
          echo "@llazyemail:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        id: install
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install

      - name: Install public dependencies only (fallback)
        if: steps.install.outcome == 'failure'
        run: |
          npm install archiver --no-save
          echo "::warning::@llazyemail/generate-template is not readable by this repo's GITHUB_TOKEN. Grant Actions access on the package for full tests. See docs/ci-packages.md"

      - name: Run pure unit tests
        run: npm run test:ci

      - name: Run full tests (when private package is available)
        if: steps.install.outcome == 'success'
        run: npm test
